<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hudson's Household Quest Log 🎮</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥷</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .manga-title {
      font-family: 'Bangers', 'Outfit', sans-serif;
      letter-spacing: 0.05em;
    }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #facc15; border-radius: 5px; border: 2px solid #000; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script>
    (function () {
      const DAD_PHONE = '919-961-8875';
      const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

      const MASTER_QUESTS = [
        {
          id: 'teeth_morning',
          title: 'Morning Tooth Armor (Brush Teeth #1)',
          description: 'Brush teeth thoroughly for 2 minutes before heading out to school.',
          category: 'MORNING',
          xp: 100,
          days: [0, 1, 2, 3, 4, 5, 6],
          timeWindow: 'Morning (Before School)',
          ruleNote: 'Every morning',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>'
        },
        {
          id: 'water_bottle',
          title: 'Hydro Mission: Sink Drop-off',
          description: 'Place your water bottle directly into the kitchen sink immediately upon arriving home.',
          category: 'AFTER_SCHOOL',
          xp: 150,
          days: [1, 2, 3, 4, 5],
          timeWindow: 'After School',
          ruleNote: 'Weekdays when returning from school',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>'
        },
        {
          id: 'homework_first',
          title: 'Brain Power: Homework Clearance',
          description: 'Finish ALL school homework before turning on screens, playing games, or using devices!',
          category: 'AFTER_SCHOOL',
          xp: 350,
          days: [1, 2, 3, 4, 5],
          timeWindow: 'After School / Cross Country',
          deviceWarning: true,
          ruleNote: 'Weekdays after school/cross country (MUST finish before device time!)',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>'
        },
        {
          id: 'tuba_practice',
          title: 'Sonic Mastery: Tuba Rehearsal',
          description: 'Practice tuba after dinner. MUST finish before Sullivan goes to sleep at 7:30 PM!',
          category: 'EVENING',
          xp: 300,
          days: [1, 2, 4, 0],
          timeWindow: 'After Dinner (Deadline: 7:30 PM)',
          ruleNote: 'Mondays, Tuesdays, Thursdays & Sundays',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>'
        },
        {
          id: 'bedtime_shower',
          title: 'Hygiene Hero: Power Shower',
          description: 'Take a full shower and clean up before crawling into bed.',
          category: 'BEDTIME',
          xp: 150,
          days: [0, 1, 2, 3, 4, 5, 6],
          timeWindow: 'Before Bed',
          ruleNote: 'Every night before bed',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v7a4 4 0 004 4h8a4 4 0 004-4V4M12 15v6m-4 0h8"/></svg>'
        },
        {
          id: 'teeth_night',
          title: 'Nightly Tooth Armor (Brush Teeth #2)',
          description: 'Brush teeth for 2 full minutes to protect against nighttime tooth bugs.',
          category: 'BEDTIME',
          xp: 100,
          days: [0, 1, 2, 3, 4, 5, 6],
          timeWindow: 'Before Bed',
          ruleNote: 'Every night before bed',
          iconSvg: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
        }
      ];

      // Web Audio SFX
      function playAudio(type) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          if (type === 'check') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
          } else if (type === 'uncheck') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
          }
        } catch (e) {}
      }

      // State Management
      let state = {
        xp: Number(localStorage.getItem('hudson_xp') || 0),
        streak: Number(localStorage.getItem('hudson_streak') || 1),
        completedMap: JSON.parse(localStorage.getItem('hudson_completed') || '{}'),
        selectedDayIndex: new Date().getDay(),
        soundEnabled: true,
        showSmsModal: false
      };

      function saveState() {
        localStorage.setItem('hudson_xp', state.xp);
        localStorage.setItem('hudson_streak', state.streak);
        localStorage.setItem('hudson_completed', JSON.stringify(state.completedMap));
      }

      function getTodayKey() {
        return new Date().toISOString().split('T')[0];
      }

      function calculateLevel(xp) {
        const level = Math.floor(xp / 500) + 1;
        const currentXp = xp % 500;
        const percent = Math.min(100, Math.round((currentXp / 500) * 100));
        let title = '🌱 Rookie Hero';
        if (level >= 10) title = '⚡ Super Saiyan Son';
        else if (level >= 5) title = '🎷 Tuba Virtuoso';
        else if (level >= 3) title = '🎮 Device Unlocked Champion';
        else if (level >= 2) title = '⭐ Apprentice Adventurer';
        return { level, currentXp, percent, title };
      }

      function getTimeLeftString() {
        const now = new Date();
        const target = new Date();
        target.setHours(19, 30, 0, 0);
        const diff = target - now;
        if (diff <= 0) return 'PASSED (Deadline was 7:30 PM)';
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        return `${h}h ${m}m ${s}s remaining`;
      }

      function render() {
        const root = document.getElementById('root');
        const todayKey = getTodayKey();
        const completedToday = state.completedMap[todayKey] || [];
        const activeQuests = MASTER_QUESTS.filter(q => q.days.includes(state.selectedDayIndex));
        const levelInfo = calculateLevel(state.xp);
        const completedCount = activeQuests.filter(q => completedToday.includes(q.id)).length;
        const totalCount = activeQuests.length;
        const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

        const smsMessage = `🎉 HUDSON QUEST UPDATE (${todayKey}):\nCompleted ${completedCount}/${totalCount} chores (${percent}%)\nStreak: ${state.streak} Days 🔥\nTarget Phone: ${DAD_PHONE}`;
        const smsUrl = `sms:${DAD_PHONE.replace(/[^0-9]/g, '')}?body=${encodeURIComponent(smsMessage)}`;

        root.innerHTML = `
          <div class="max-w-4xl mx-auto p-4 sm:p-8">
            
            <!-- HEADER HUD -->
            <header class="relative bg-slate-900 border-4 border-yellow-400 rounded-2xl p-6 shadow-[8px_8px_0px_0px_rgba(250,204,21,1)] mb-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem;">
                
                <div style="display: flex; align-items: center; gap: 1rem;">
                  <div style="width: 5rem; height: 5rem; border-radius: 1rem; background: linear-gradient(to top right, #eab308, #f59e0b, #ef4444); border: 4px solid #000; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative;">
                    🥷
                    <div style="position: absolute; bottom: -0.5rem; right: -0.5rem; background: #facc15; color: #000; font-weight: 900; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 9999px; border: 2px solid #000;">
                      LVL ${levelInfo.level}
                    </div>
                  </div>

                  <div>
                    <h1 class="text-3xl font-black text-yellow-400 tracking-wider uppercase">
                      HUDSON'S QUEST LOG
                    </h1>
                    <p class="text-amber-300 font-bold text-sm">
                      Rank: <span class="text-white underline decoration-yellow-400">${levelInfo.title}</span>
                    </p>
                    <div class="mt-1 flex items-center gap-1 bg-red-950 border border-red-500 text-red-300 px-2.5 py-0.5 rounded-lg text-xs font-black w-fit">
                      🔥 STREAK: ${state.streak} DAYS
                    </div>
                  </div>
                </div>

                <!-- XP PROGRESS BAR -->
                <div style="flex: 1; min-width: 250px; background: #020617; padding: 0.75rem; border-radius: 0.75rem; border: 2px solid rgba(245, 158, 11, 0.5);">
                  <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 0.75rem; margin-bottom: 0.25rem;">
                    <span style="color: #facc15;">⚡ XP PROGRESS</span>
                    <span style="color: #cbd5e1;">${levelInfo.currentXp} / 500 XP</span>
                  </div>
                  <div style="width: 100%; height: 1rem; background: #1e293b; border-radius: 9999px; border: 1px solid #000; overflow: hidden;">
                    <div style="height: 100%; background: linear-gradient(to right, #f59e0b, #facc15); width: ${levelInfo.percent}%; transition: width 0.5s;"></div>
                  </div>
                </div>

                <!-- CONTROLS & DAY SIMULATOR -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <div class="bg-slate-950 px-3 py-2 rounded-xl border border-yellow-500/40 text-xs font-bold text-yellow-300">
                    <select id="daySelect" class="bg-transparent text-yellow-300 font-bold focus:outline-none cursor-pointer">
                      ${DAYS_OF_WEEK.map((name, i) => `
                        <option value="${i}" ${i === state.selectedDayIndex ? 'selected' : ''} class="bg-slate-900 text-white">
                          ${name} ${i === new Date().getDay() ? '(Today)' : ''}
                        </option>
                      `).join('')}
                    </select>
                  </div>

                  <button id="soundBtn" class="p-2.5 bg-slate-800 border-2 border-yellow-400 text-yellow-400 rounded-xl font-bold">
                    ${state.soundEnabled ? '🔊' : '🔇'}
                  </button>

                  <button id="smsModalBtn" class="px-3.5 py-2.5 bg-gradient-to-r from-red-600 to-amber-600 text-white font-black text-xs rounded-xl border-2 border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    📱 NOTIFY DAD (SMS)
                  </button>
                </div>

              </div>
            </header>

            <!-- MISSION PROGRESS BANNER -->
            <div class="bg-slate-900 border-4 border-yellow-400 p-5 rounded-2xl shadow-[6px_6px_0px_0px_rgba(250,204,21,1)] mb-8">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 class="text-xl font-black text-white uppercase">TODAY'S MISSION DIRECTIVE</h2>
                <span class="bg-yellow-400 text-black px-3 py-1 rounded-full font-black text-xs border border-black">
                  ${completedCount} / ${totalCount} QUESTS CLEAR (${percent}%)
                </span>
              </div>
              <div style="width: 100%; height: 1rem; background: #020617; border-radius: 9999px; border: 1px solid #000; overflow: hidden;">
                <div style="height: 100%; background: linear-gradient(to right, #10b981, #2dd4bf); width: ${percent}%; transition: width 0.5s;"></div>
              </div>
            </div>

            <!-- QUEST LIST CARDS -->
            <div class="space-y-4">
              ${activeQuests.map(quest => {
                const isDone = completedToday.includes(quest.id);
                return `
                  <div class="p-5 rounded-2xl border-4 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${isDone ? 'bg-slate-900/90 border-emerald-400 shadow-[4px_4px_0px_0px_rgba(16,185,129,1)]' : 'bg-slate-900 border-slate-700 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]'}">
                    <div style="display: flex; align-items: flex-start; gap: 0.875rem;">
                      <div class="p-3 rounded-xl border-2 border-black ${isDone ? 'bg-emerald-400 text-black' : 'bg-yellow-400 text-black'}">
                        ${quest.iconSvg}
                      </div>
                      <div>
                        <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                          <h3 class="text-lg font-black uppercase ${isDone ? 'text-emerald-400 line-through' : 'text-white'}">
                            ${quest.title}
                          </h3>
                          <span class="bg-yellow-400 text-black font-black text-xs px-2 py-0.5 rounded-full border border-black">
                            +${quest.xp} XP
                          </span>
                          ${quest.deviceWarning ? `
                            <span class="bg-red-600 text-white font-black text-xs px-2 py-0.5 rounded-full border border-black">
                              🔒 NO DEVICES UNTIL DONE!
                            </span>
                          ` : ''}
                        </div>
                        <p class="text-slate-300 text-xs mt-1">${quest.description}</p>
                        ${quest.id === 'tuba_practice' ? `
                          <div class="mt-2 text-xs font-black text-amber-400 bg-slate-950 p-2 rounded-lg border border-yellow-500/40">
                            ⏰ Sullivan Bedtime Deadline (7:30 PM): <span class="text-white underline">${getTimeLeftString()}</span>
                          </div>
                        ` : ''}
                      </div>
                    </div>

                    <button data-quest="${quest.id}" data-xp="${quest.xp}" class="toggleBtn px-5 py-3 rounded-xl font-black text-xs border-2 border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] ${isDone ? 'bg-emerald-500 text-black' : 'bg-yellow-400 text-black hover:bg-yellow-300'}">
                      ${isDone ? '✅ COMPLETED' : `CHECK OFF (+${quest.xp} XP)`}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- SMS MODAL -->
            ${state.showSmsModal ? `
              <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50;">
                <div class="bg-slate-900 border-4 border-yellow-400 rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-[10px_10px_0px_0px_rgba(250,204,21,1)]">
                  <h3 class="text-2xl font-black text-yellow-400">NOTIFY DAD (SMS ALERT)</h3>
                  <p class="text-xs text-slate-300">Target Phone: <strong class="text-yellow-400">${DAD_PHONE}</strong></p>
                  <pre class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-left text-slate-200 font-mono whitespace-pre-wrap">${smsMessage}</pre>
                  <a href="${smsUrl}" id="closeSmsLink" class="block w-full py-3 bg-emerald-500 text-black font-black rounded-xl border-2 border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    📱 OPEN MESSAGES APP & SEND TO DAD
                  </a>
                  <button id="closeSmsBtn" class="text-xs text-slate-400 underline">Close Modal</button>
                </div>
              </div>
            ` : ''}

          </div>
        `;

        // Attach Event Listeners
        const daySelect = document.getElementById('daySelect');
        if (daySelect) {
          daySelect.addEventListener('change', (e) => {
            state.selectedDayIndex = Number(e.target.value);
            render();
          });
        }

        const soundBtn = document.getElementById('soundBtn');
        if (soundBtn) {
          soundBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            render();
          });
        }

        const smsModalBtn = document.getElementById('smsModalBtn');
        if (smsModalBtn) {
          smsModalBtn.addEventListener('click', () => {
            state.showSmsModal = true;
            render();
          });
        }

        const closeSmsBtn = document.getElementById('closeSmsBtn');
        if (closeSmsBtn) {
          closeSmsBtn.addEventListener('click', () => {
            state.showSmsModal = false;
            render();
          });
        }

        const closeSmsLink = document.getElementById('closeSmsLink');
        if (closeSmsLink) {
          closeSmsLink.addEventListener('click', () => {
            state.showSmsModal = false;
            render();
          });
        }

        document.querySelectorAll('.toggleBtn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const qId = e.currentTarget.getAttribute('data-quest');
            const qXp = Number(e.currentTarget.getAttribute('data-xp'));
            const isDone = completedToday.includes(qId);

            if (isDone) {
              state.completedMap[todayKey] = completedToday.filter(id => id !== qId);
              state.xp = Math.max(0, state.xp - qXp);
              if (state.soundEnabled) playAudio('uncheck');
            } else {
              state.completedMap[todayKey] = [...completedToday, qId];
              state.xp += qXp;
              if (state.soundEnabled) playAudio('check');
              if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            }

            saveState();
            render();
          });
        });
      }

      // Initial Render & Timer Interval
      render();
      setInterval(render, 1000);
    })();
  </script>
</body>
</html>
